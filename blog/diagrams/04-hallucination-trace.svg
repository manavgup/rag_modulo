<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="560" fill="#0f172a" rx="12"/>

  <text x="400" y="32" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">Anatomy of a RAG Hallucination (Issue #773)</text>
  <text x="400" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">Query: "what were the ibm results in 2020?" — Expected: Revenue $73.6B — Got: fabricated numbers</text>

  <defs>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 5 10 L 10 0 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Stage 1: Query -->
  <rect x="250" y="70" width="300" height="40" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="400" y="94" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">"what were the ibm results in 2020?"</text>
  <line x1="400" y1="110" x2="400" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Stage 2: Vector Search -->
  <rect x="100" y="135" width="280" height="80" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="240" y="155" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="700">VECTOR SEARCH (Milvus ANN)</text>
  <text x="240" y="172" text-anchor="middle" fill="#94a3b8" font-size="10">Financial table chunk → rank #72 of 761</text>
  <text x="240" y="186" text-anchor="middle" fill="#f87171" font-size="10">Tabular data has low cosine similarity</text>
  <text x="240" y="200" text-anchor="middle" fill="#f87171" font-size="10">to natural language queries</text>
  <circle cx="370" cy="150" r="8" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="370" y="154" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="700">1</text>

  <!-- Stage 2b: Keyword Search -->
  <rect x="420" y="135" width="280" height="80" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="560" y="155" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="700">KEYWORD SEARCH (TF-IDF)</text>
  <text x="560" y="172" text-anchor="middle" fill="#f87171" font-size="10" font-weight="600">CRASHED SILENTLY</text>
  <text x="560" y="186" text-anchor="middle" fill="#94a3b8" font-size="10">Source.PDF enum bug → 0 results</text>
  <text x="560" y="200" text-anchor="middle" fill="#94a3b8" font-size="10">Pipeline continued without it</text>
  <circle cx="690" cy="150" r="8" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="690" y="154" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="700">2</text>

  <line x1="400" y1="215" x2="400" y2="235" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Stage 3: RRF Fusion -->
  <rect x="200" y="240" width="400" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="264" text-anchor="middle" fill="#fcd34d" font-size="11">RRF Fusion: 50 vector + 0 keyword = effectively pure vector search</text>

  <line x1="400" y1="280" x2="400" y2="300" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Stage 4: Cross-encoder Reranking -->
  <rect x="130" y="305" width="540" height="80" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="325" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="700">CROSS-ENCODER RERANKING (ms-marco-MiniLM)</text>
  <text x="400" y="343" text-anchor="middle" fill="#94a3b8" font-size="10">#1 Page 92 (segment realignment) 1.00 | #2 Page 19 (section intro) 0.97</text>
  <text x="400" y="357" text-anchor="middle" fill="#94a3b8" font-size="10">#3 Page 21 (COVID narrative) 0.92 | #4 Page 19 (mgmt discussion) 0.90</text>
  <text x="400" y="371" text-anchor="middle" fill="#f87171" font-size="10" font-weight="600">ALL narrative chunks. ZERO financial data.</text>
  <circle cx="660" cy="320" r="8" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="660" y="324" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="700">3</text>

  <line x1="400" y1="385" x2="400" y2="405" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Stage 5: Entity Extraction Bug -->
  <rect x="200" y="410" width="400" height="45" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="400" y="430" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="700">ENTITY EXTRACTION BUG</text>
  <text x="400" y="445" text-anchor="middle" fill="#94a3b8" font-size="10">Query mangled to: "...in 2020? (in the context of 2020)"</text>
  <circle cx="590" cy="420" r="8" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="590" y="424" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="700">4</text>

  <line x1="400" y1="455" x2="400" y2="475" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Stage 6: LLM Generation -->
  <rect x="150" y="480" width="500" height="55" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="400" y="500" text-anchor="middle" fill="#86efac" font-size="10" font-weight="700">LLM GENERATION (WatsonX granite-4-h-small)</text>
  <text x="400" y="515" text-anchor="middle" fill="#94a3b8" font-size="10">Context: 5 narrative chunks (~6,100 chars) — no financial figures present</text>
  <text x="400" y="528" text-anchor="middle" fill="#fbbf24" font-size="10">LLM performed correctly given its context — the problem was 100% retrieval</text>
  <circle cx="640" cy="495" r="8" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="640" y="499" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="700">5</text>

  <!-- Summary -->
  <text x="400" y="552" text-anchor="middle" fill="#64748b" font-size="10">5 independent design decisions combined to produce fabricated financial data. No single component was "wrong."</text>
</svg>
