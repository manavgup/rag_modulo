  <text x="447" y="272" fill="#4ade80" font-size="12" font-weight="600">Project skills</text>
  <rect x="565" y="258" width="170" height="20" rx="3" fill="#292524"/>
  <rect x="567" y="260" width="20" height="16" rx="2" fill="#22c55e" fill-opacity="0.6"/>
  <text x="725" y="272" text-anchor="end" fill="#86efac" font-size="11">3 project-specific</text>

  <!-- Rules -->
  <rect x="435" y="295" width="315" height="36" rx="4" fill="#1e293b"/>
  <text x="447" y="317" fill="#4ade80" font-size="12" font-weight="600">Project rules</text>
  <rect x="565" y="303" width="170" height="20" rx="3" fill="#292524"/>
  <rect x="567" y="305" width="20" height="16" rx="2" fill="#22c55e" fill-opacity="0.6"/>
  <text x="725" y="317" text-anchor="end" fill="#86efac" font-size="11">3 files (new)</text>

