  <rect x="435" y="205" width="315" height="36" rx="4" fill="#1e293b"/>
  <text x="447" y="227" fill="#4ade80" font-size="12" font-weight="600">Command files</text>
  <rect x="565" y="213" width="170" height="20" rx="3" fill="#292524"/>
