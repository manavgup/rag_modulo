  <rect x="435" y="345" width="315" height="36" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="1" stroke-opacity="0.5"/>
  <text x="447" y="367" fill="#fbbf24" font-size="12" font-weight="600">Context cost/session</text>
  <text x="725" y="367" text-anchor="end" fill="#4ade80" font-size="12" font-weight="700">~2-3K tokens</text>

  <!-- What remained -->
  <text x="592" y="410" text-anchor="middle" fill="#94a3b8" font-size="10">Kept: cicd-stability-guardian, rag-debugger,</text>
  <text x="592" y="424" text-anchor="middle" fill="#94a3b8" font-size="10">pr-reviewer, core agents (planner, coder, tester),</text>
  <text x="592" y="438" text-anchor="middle" fill="#94a3b8" font-size="10">backend-service-pattern, search-pipeline, testing-conventions</text>
