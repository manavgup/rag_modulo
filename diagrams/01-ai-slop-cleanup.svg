  <text x="62" y="317" fill="#f87171" font-size="12" font-weight="600">Project rules</text>
  <rect x="180" y="303" width="170" height="20" rx="3" fill="#292524"/>
  <text x="340" y="317" text-anchor="end" fill="#94a3b8" font-size="11">0 files</text>

