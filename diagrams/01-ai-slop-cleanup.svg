  <text x="207" y="100" text-anchor="middle" fill="#f87171" font-size="14" font-weight="700">BEFORE</text>

  <!-- CLAUDE.md -->
  <rect x="50" y="115" width="315" height="36" rx="4" fill="#1e293b"/>
  <text x="62" y="137" fill="#f87171" font-size="12" font-weight="600">CLAUDE.md</text>
