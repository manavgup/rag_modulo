  <text x="590" y="411" fill="#94a3b8" font-size="9">LLMBase → Factory pattern</text>
  <rect x="590" y="418" width="72" height="20" rx="3" fill="#ec4899" fill-opacity="0.15"/>
  <text x="626" y="432" text-anchor="middle" fill="#f9a8d4" font-size="9">WatsonX</text>
  <rect x="670" y="418" width="62" height="20" rx="3" fill="#ec4899" fill-opacity="0.15"/>
  <text x="701" y="432" text-anchor="middle" fill="#f9a8d4" font-size="9">OpenAI</text>
  <rect x="740" y="418" width="72" height="20" rx="3" fill="#ec4899" fill-opacity="0.15"/>
  <text x="776" y="432" text-anchor="middle" fill="#f9a8d4" font-size="9">Anthropic</text>

