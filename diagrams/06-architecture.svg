  <text x="206" y="311" fill="#fde68a" font-size="8">QuestionDecomposer / AnswerSynthesizer</text>

  <!-- Pipeline -->
  <text x="400" y="256" fill="#fbbf24" font-size="9" font-weight="600">Pipeline Stages</text>
  <rect x="400" y="261" width="160" height="16" rx="2" fill="#f59e0b" fill-opacity="0.1"/>
  <text x="406" y="273" fill="#fde68a" font-size="8">PipelineResolution</text>
  <rect x="400" y="280" width="160" height="16" rx="2" fill="#f59e0b" fill-opacity="0.1"/>
  <text x="406" y="292" fill="#fde68a" font-size="8">QueryEnhancement / Retrieval</text>
  <rect x="400" y="299" width="160" height="16" rx="2" fill="#f59e0b" fill-opacity="0.1"/>
  <text x="406" y="311" fill="#fde68a" font-size="8">Reranking / Reasoning / Generation</text>

  <!-- Conversation & Content -->
  <text x="580" y="256" fill="#fbbf24" font-size="9" font-weight="600">Conversation</text>
  <rect x="580" y="261" width="140" height="16" rx="2" fill="#f59e0b" fill-opacity="0.1"/>
  <text x="586" y="273" fill="#fde68a" font-size="8">ConversationService</text>
  <rect x="580" y="280" width="140" height="16" rx="2" fill="#f59e0b" fill-opacity="0.1"/>
  <text x="586" y="292" fill="#fde68a" font-size="8">MessageProcessingOrchestrator</text>
  <rect x="580" y="299" width="140" height="16" rx="2" fill="#f59e0b" fill-opacity="0.1"/>
  <text x="586" y="311" fill="#fde68a" font-size="8">ConversationContextService</text>

