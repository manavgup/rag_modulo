  <text x="200" y="256" fill="#fbbf24" font-size="9" font-weight="600">Core Search</text>
  <rect x="200" y="261" width="180" height="16" rx="2" fill="#f59e0b" fill-opacity="0.1"/>
  <text x="206" y="273" fill="#fde68a" font-size="8">SearchService → PipelineExecutor</text>
  <rect x="200" y="280" width="180" height="16" rx="2" fill="#f59e0b" fill-opacity="0.1"/>
