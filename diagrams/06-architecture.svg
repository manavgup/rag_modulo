  <rect x="30" y="460" width="520" height="50" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="50" y="482" fill="#22d3ee" font-size="11" font-weight="700">MODELS (19) + SCHEMAS (25)</text>
  <text x="50" y="496" fill="#94a3b8" font-size="9">SQLAlchemy models + Pydantic validation</text>
  <text x="350" y="482" fill="#67e8f9" font-size="8">collection, conversation, file, pipeline, user, team, llm_*, prompt_template,</text>
  <text x="350" y="496" fill="#67e8f9" font-size="8">podcast, voice, agent, question, runtime_config, pipeline_context, structured_output...</text>

  <!-- Vector Stores -->
  <rect x="570" y="460" width="300" height="50" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="590" y="482" fill="#c4b5fd" font-size="11" font-weight="700">VECTOR STORES (5)</text>
  <text x="590" y="496" fill="#94a3b8" font-size="9">VectorStore base → Factory</text>
  <text x="750" y="482" fill="#ddd6fe" font-size="8">Milvus</text>
  <text x="750" y="496" fill="#ddd6fe" font-size="8">Elasticsearch  Pinecone  Weaviate  ChromaDB</text>

