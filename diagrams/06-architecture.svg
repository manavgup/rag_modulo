  <text x="50" y="550" fill="#94a3b8" font-size="11" font-weight="700">INFRASTRUCTURE</text>
  <rect x="200" y="540" width="80" height="24" rx="4" fill="#334155"/>
  <text x="240" y="556" text-anchor="middle" fill="#cbd5e1" font-size="9">PostgreSQL</text>
  <rect x="290" y="540" width="65" height="24" rx="4" fill="#334155"/>
  <text x="322" y="556" text-anchor="middle" fill="#cbd5e1" font-size="9">Milvus</text>
  <rect x="365" y="540" width="55" height="24" rx="4" fill="#334155"/>
  <text x="392" y="556" text-anchor="middle" fill="#cbd5e1" font-size="9">MinIO</text>
  <rect x="430" y="540" width="60" height="24" rx="4" fill="#334155"/>
  <text x="460" y="556" text-anchor="middle" fill="#cbd5e1" font-size="9">MLFlow</text>
  <rect x="500" y="540" width="45" height="24" rx="4" fill="#334155"/>
  <text x="522" y="556" text-anchor="middle" fill="#cbd5e1" font-size="9">etcd</text>
  <text x="580" y="556" fill="#64748b" font-size="9">9 Docker Compose configs | Helm chart | Terraform + Ansible</text>

  <!-- CI/CD bar -->
  <rect x="30" y="600" width="840" height="45" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="50" y="620" fill="#94a3b8" font-size="11" font-weight="700">CI/CD</text>
  <text x="50" y="634" fill="#64748b" font-size="9">21 GitHub workflows</text>
  <rect x="200" y="610" width="50" height="18" rx="3" fill="#22c55e" fill-opacity="0.1"/>
  <text x="225" y="623" text-anchor="middle" fill="#86efac" font-size="8">01-lint</text>
  <rect x="256" y="610" width="68" height="18" rx="3" fill="#22c55e" fill-opacity="0.1"/>
  <text x="290" y="623" text-anchor="middle" fill="#86efac" font-size="8">02-security</text>
  <rect x="330" y="610" width="52" height="18" rx="3" fill="#22c55e" fill-opacity="0.1"/>
  <text x="356" y="623" text-anchor="middle" fill="#86efac" font-size="8">03-build</text>
  <rect x="388" y="610" width="56" height="18" rx="3" fill="#22c55e" fill-opacity="0.1"/>
  <text x="416" y="623" text-anchor="middle" fill="#86efac" font-size="8">04-pytest</text>
  <rect x="450" y="610" width="38" height="18" rx="3" fill="#22c55e" fill-opacity="0.1"/>
  <text x="469" y="623" text-anchor="middle" fill="#86efac" font-size="8">05-ci</text>
  <text x="510" y="623" fill="#64748b" font-size="8">+ weekly-security-audit, deploy_complete_app, deploy_code_engine, build-multiarch, deploy-docs...</text>

  <!-- Legend -->
  <text x="450" y="665" text-anchor="middle" fill="#475569" font-size="9">Router → Service → Repository → Model | each layer has a single responsibility</text>
</svg>
