  <text x="50" y="411" fill="#94a3b8" font-size="9">Data access — SQLAlchemy ORM</text>
  <text x="200" y="403" fill="#86efac" font-size="8">collection  conversation  file  pipeline  pipeline_context  user  team</text>
  <text x="200" y="418" fill="#86efac" font-size="8">llm_provider  llm_model  llm_parameters  prompt_template  podcast  voice</text>
  <text x="200" y="433" fill="#86efac" font-size="8">question  runtime_config  token_warning  user_collection  user_provider  agent  user_team</text>

