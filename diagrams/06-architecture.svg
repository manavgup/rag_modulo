<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="system-ui, -apple-system, sans-serif">
  <rect width="900" height="680" fill="#0f172a" rx="12"/>

  <text x="450" y="32" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">RAG Modulo Architecture</text>
  <text x="450" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">37 services, 21 repositories, 18 routers, 19 models, 25 schemas, 3 LLM providers, 5 vector DBs</text>

  <!-- Frontend layer -->
  <rect x="30" y="68" width="840" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="50" y="88" fill="#60a5fa" font-size="11" font-weight="700">FRONTEND</text>
  <text x="50" y="103" fill="#94a3b8" font-size="9">React 18 + Vite + Tailwind + Carbon</text>
  <text x="200" y="96" fill="#cbd5e1" font-size="9">search/</text>
  <text x="280" y="96" fill="#cbd5e1" font-size="9">collections/</text>
  <text x="380" y="96" fill="#cbd5e1" font-size="9">podcasts/</text>
  <text x="460" y="96" fill="#cbd5e1" font-size="9">analytics/</text>
  <text x="548" y="96" fill="#cbd5e1" font-size="9">agents/</text>
  <text x="618" y="96" fill="#cbd5e1" font-size="9">auth/</text>
  <text x="200" y="116" fill="#64748b" font-size="9">8 reusable UI components (Button, Input, Modal, Card, FileUpload, Select, TextArea, Badge)</text>

  <!-- Router layer -->
  <rect x="30" y="145" width="840" height="68" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="50" y="167" fill="#a78bfa" font-size="11" font-weight="700">ROUTERS (18)</text>
  <text x="50" y="181" fill="#94a3b8" font-size="9">FastAPI endpoints — thin HTTP layer</text>
  <rect x="200" y="155" width="75" height="22" rx="3" fill="#8b5cf6" fill-opacity="0.15"/>
  <text x="237" y="170" text-anchor="middle" fill="#c4b5fd" font-size="8">search</text>
  <rect x="282" y="155" width="85" height="22" rx="3" fill="#8b5cf6" fill-opacity="0.15"/>
  <text x="324" y="170" text-anchor="middle" fill="#c4b5fd" font-size="8">conversation</text>
  <rect x="374" y="155" width="75" height="22" rx="3" fill="#8b5cf6" fill-opacity="0.15"/>
  <text x="411" y="170" text-anchor="middle" fill="#c4b5fd" font-size="8">collection</text>
  <rect x="456" y="155" width="62" height="22" rx="3" fill="#8b5cf6" fill-opacity="0.15"/>
  <text x="487" y="170" text-anchor="middle" fill="#c4b5fd" font-size="8">podcast</text>
  <rect x="525" y="155" width="62" height="22" rx="3" fill="#8b5cf6" fill-opacity="0.15"/>
  <text x="556" y="170" text-anchor="middle" fill="#c4b5fd" font-size="8">chat</text>
  <rect x="594" y="155" width="55" height="22" rx="3" fill="#8b5cf6" fill-opacity="0.15"/>
  <text x="621" y="170" text-anchor="middle" fill="#c4b5fd" font-size="8">auth</text>
  <rect x="656" y="155" width="52" height="22" rx="3" fill="#8b5cf6" fill-opacity="0.15"/>
  <text x="682" y="170" text-anchor="middle" fill="#c4b5fd" font-size="8">user</text>
  <rect x="715" y="155" width="52" height="22" rx="3" fill="#8b5cf6" fill-opacity="0.15"/>
  <text x="741" y="170" text-anchor="middle" fill="#c4b5fd" font-size="8">health</text>
  <rect x="774" y="155" width="52" height="22" rx="3" fill="#8b5cf6" fill-opacity="0.15"/>
  <text x="800" y="170" text-anchor="middle" fill="#c4b5fd" font-size="8">mcp</text>
  <text x="200" y="200" fill="#64748b" font-size="8">+ dashboard, llm_provider, runtime_config, team, token_warning, voice, websocket, agent</text>

  <!-- Service layer -->
  <rect x="30" y="230" width="840" height="130" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="50" y="252" fill="#fcd34d" font-size="11" font-weight="700">SERVICES (37)</text>
  <text x="50" y="266" fill="#94a3b8" font-size="9">Business logic + dependency injection</text>

