  <text x="740" y="256" fill="#fbbf24" font-size="9" font-weight="600">Config / Other</text>
  <rect x="740" y="261" width="115" height="16" rx="2" fill="#f59e0b" fill-opacity="0.1"/>
  <text x="746" y="273" fill="#fde68a" font-size="8">LLMProvider/Model/Params</text>
  <rect x="740" y="280" width="115" height="16" rx="2" fill="#f59e0b" fill-opacity="0.1"/>
  <text x="746" y="292" fill="#fde68a" font-size="8">PodcastService</text>
  <rect x="740" y="299" width="115" height="16" rx="2" fill="#f59e0b" fill-opacity="0.1"/>
  <text x="746" y="311" fill="#fde68a" font-size="8">ConfigCache / PipelineCtx</text>

  <!-- DI note -->
  <text x="200" y="346" fill="#64748b" font-size="8">+ EntityExtraction, SourceAttribution, CitationAttribution, OutputValidator, TokenTracking, Collection, File, User, Team, Dashboard, Voice, Agent, MCPGateway, RuntimeConfig</text>

  <!-- Repository layer -->
  <rect x="30" y="375" width="520" height="68" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
