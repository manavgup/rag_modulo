<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="flowArrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="900" height="750" fill="#0f172a" rx="12"/>

  <text x="450" y="30" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">RAG Modulo Architecture</text>
  <text x="450" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">Service layer + Repository pattern + FastAPI routers + Dependency Injection</text>

  <!-- Left margin: architecture pattern label -->
  <text x="16" y="220" fill="#334155" font-size="9" transform="rotate(-90, 16, 220)" text-anchor="middle" font-weight="600">REQUEST FLOW</text>
  <line x1="25" y1="75" x2="25" y2="365" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M25 365 L25 375" stroke="#334155" stroke-width="1" marker-end="url(#flowArrow)"/>

  <!-- === CLIENT === -->
  <rect x="40" y="65" width="830" height="40" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" stroke-opacity="0.5"/>
  <text x="60" y="88" fill="#94a3b8" font-size="10" font-weight="600">CLIENT</text>
  <text x="170" y="88" fill="#64748b" font-size="9">React 18 + Vite + Carbon Design | 17 component dirs | 8 reusable UI primitives | TypeScript</text>

  <!-- Arrow down -->
  <line x1="450" y1="105" x2="450" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#flowArrow)"/>
  <text x="460" y="116" fill="#3b82f6" font-size="8">HTTP/REST</text>

  <!-- === ROUTER LAYER === -->
  <rect x="40" y="125" width="830" height="75" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <rect x="42" y="127" width="826" height="3" rx="1" fill="#3b82f6" fill-opacity="0.4"/>
  <text x="60" y="150" fill="#60a5fa" font-size="12" font-weight="700">FastAPI Router Layer</text>
  <text x="60" y="164" fill="#94a3b8" font-size="9">Thin HTTP controllers — validation, auth, delegate to services. No business logic.</text>
  <text x="60" y="178" fill="#64748b" font-size="9">18 routers:</text>

  <!-- Router pills -->
  <rect x="145" y="170" width="60" height="18" rx="3" fill="#3b82f6" fill-opacity="0.12"/>
  <text x="175" y="183" text-anchor="middle" fill="#93c5fd" font-size="8">search</text>
  <rect x="212" y="170" width="82" height="18" rx="3" fill="#3b82f6" fill-opacity="0.12"/>
  <text x="253" y="183" text-anchor="middle" fill="#93c5fd" font-size="8">conversation</text>
  <rect x="301" y="170" width="68" height="18" rx="3" fill="#3b82f6" fill-opacity="0.12"/>
  <text x="335" y="183" text-anchor="middle" fill="#93c5fd" font-size="8">collection</text>
  <rect x="376" y="170" width="58" height="18" rx="3" fill="#3b82f6" fill-opacity="0.12"/>
  <text x="405" y="183" text-anchor="middle" fill="#93c5fd" font-size="8">podcast</text>
  <rect x="441" y="170" width="42" height="18" rx="3" fill="#3b82f6" fill-opacity="0.12"/>
  <text x="462" y="183" text-anchor="middle" fill="#93c5fd" font-size="8">auth</text>
  <rect x="490" y="170" width="42" height="18" rx="3" fill="#3b82f6" fill-opacity="0.12"/>
  <text x="511" y="183" text-anchor="middle" fill="#93c5fd" font-size="8">user</text>
  <rect x="539" y="170" width="42" height="18" rx="3" fill="#3b82f6" fill-opacity="0.12"/>
  <text x="560" y="183" text-anchor="middle" fill="#93c5fd" font-size="8">chat</text>
  <rect x="588" y="170" width="42" height="18" rx="3" fill="#3b82f6" fill-opacity="0.12"/>
  <text x="609" y="183" text-anchor="middle" fill="#93c5fd" font-size="8">mcp</text>
  <rect x="637" y="170" width="52" height="18" rx="3" fill="#3b82f6" fill-opacity="0.12"/>
  <text x="663" y="183" text-anchor="middle" fill="#93c5fd" font-size="8">health</text>
  <rect x="696" y="170" width="62" height="18" rx="3" fill="#3b82f6" fill-opacity="0.12"/>
  <text x="727" y="183" text-anchor="middle" fill="#93c5fd" font-size="8">dashboard</text>
  <text x="770" y="183" fill="#475569" font-size="8">+8 more</text>

  <!-- Arrow down -->
  <line x1="450" y1="200" x2="450" y2="215" stroke="#475569" stroke-width="1.5" marker-end="url(#flowArrow)"/>
  <text x="460" y="211" fill="#f59e0b" font-size="8">DI inject</text>

  <!-- === SERVICE LAYER === -->
  <rect x="40" y="220" width="830" height="165" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <rect x="42" y="222" width="826" height="3" rx="1" fill="#f59e0b" fill-opacity="0.4"/>
  <text x="60" y="245" fill="#fcd34d" font-size="12" font-weight="700">Service Layer (37 services)</text>
  <text x="60" y="259" fill="#94a3b8" font-size="9">All business logic lives here. Constructor-based DI. Services call repositories, never the DB directly.</text>

  <!-- Core Search cluster -->
  <rect x="55" y="270" width="195" height="105" rx="6" fill="#292524" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="65" y="286" fill="#fbbf24" font-size="9" font-weight="700">Core Search</text>
  <text x="65" y="300" fill="#fde68a" font-size="8">SearchService</text>
  <text x="65" y="312" fill="#fde68a" font-size="8">ChainOfThoughtService</text>
  <text x="65" y="324" fill="#fde68a" font-size="8">QuestionDecomposer</text>
  <text x="65" y="336" fill="#fde68a" font-size="8">AnswerSynthesizer</text>
  <text x="65" y="348" fill="#fde68a" font-size="8">EntityExtractionService</text>
  <text x="65" y="360" fill="#fde68a" font-size="8">SourceAttributionService</text>

  <!-- Pipeline cluster -->
  <rect x="260" y="270" width="175" height="105" rx="6" fill="#292524" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="270" y="286" fill="#fbbf24" font-size="9" font-weight="700">Pipeline Stages</text>
  <text x="270" y="300" fill="#fde68a" font-size="8">PipelineResolutionStage</text>
  <text x="270" y="312" fill="#fde68a" font-size="8">QueryEnhancementStage</text>
  <text x="270" y="324" fill="#fde68a" font-size="8">RetrievalStage</text>
  <text x="270" y="336" fill="#fde68a" font-size="8">RerankingStage</text>
  <text x="270" y="348" fill="#fde68a" font-size="8">ReasoningStage</text>
  <text x="270" y="360" fill="#fde68a" font-size="8">GenerationStage</text>

  <!-- Conversation cluster -->
  <rect x="445" y="270" width="195" height="105" rx="6" fill="#292524" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="455" y="286" fill="#fbbf24" font-size="9" font-weight="700">Conversation</text>
  <text x="455" y="300" fill="#fde68a" font-size="8">ConversationService</text>
  <text x="455" y="312" fill="#fde68a" font-size="8">MessageProcessingOrchestrator</text>
  <text x="455" y="324" fill="#fde68a" font-size="8">ConversationContextService</text>
  <text x="455" y="336" fill="#fde68a" font-size="8">ConversationSummarizationSvc</text>
  <text x="455" y="348" fill="#fde68a" font-size="8">TokenTrackingService</text>
  <text x="455" y="360" fill="#fde68a" font-size="8">DashboardService</text>

  <!-- Config cluster -->
  <rect x="650" y="270" width="210" height="105" rx="6" fill="#292524" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="660" y="286" fill="#fbbf24" font-size="9" font-weight="700">Config + Support</text>
  <text x="660" y="300" fill="#fde68a" font-size="8">LLMProviderService / ModelService</text>
  <text x="660" y="312" fill="#fde68a" font-size="8">LLMParametersService</text>
  <text x="660" y="324" fill="#fde68a" font-size="8">PromptTemplateService</text>
  <text x="660" y="336" fill="#fde68a" font-size="8">PipelineService / ConfigCache</text>
  <text x="660" y="348" fill="#fde68a" font-size="8">CollectionService / FileService</text>
  <text x="660" y="360" fill="#fde68a" font-size="8">PodcastService / VoiceService</text>

  <!-- Arrow down -->
  <line x1="450" y1="385" x2="450" y2="400" stroke="#475569" stroke-width="1.5" marker-end="url(#flowArrow)"/>
  <text x="460" y="396" fill="#22c55e" font-size="8">SQLAlchemy</text>

  <!-- === REPOSITORY LAYER === -->
  <rect x="40" y="405" width="520" height="80" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <rect x="42" y="407" width="516" height="3" rx="1" fill="#22c55e" fill-opacity="0.4"/>
  <text x="60" y="430" fill="#4ade80" font-size="12" font-weight="700">Repository Layer (21 repositories)</text>
  <text x="60" y="444" fill="#94a3b8" font-size="9">Data access only. Returns SQLAlchemy models, never Pydantic schemas. One repo per domain entity.</text>
  <text x="60" y="460" fill="#86efac" font-size="8">collection  conversation  file  pipeline  pipeline_context  user  team  llm_provider</text>
  <text x="60" y="472" fill="#86efac" font-size="8">llm_model  llm_parameters  prompt_template  podcast  voice  question  runtime_config  agent ...</text>

  <!-- === LLM PROVIDERS (right side) === -->
  <rect x="580" y="405" width="290" height="80" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
  <rect x="582" y="407" width="286" height="3" rx="1" fill="#ec4899" fill-opacity="0.4"/>
  <text x="600" y="430" fill="#f9a8d4" font-size="12" font-weight="700">LLM Providers</text>
  <text x="600" y="444" fill="#94a3b8" font-size="9">LLMBase abstract → Factory pattern</text>
  <rect x="600" y="452" width="72" height="22" rx="4" fill="#ec4899" fill-opacity="0.12"/>
  <text x="636" y="467" text-anchor="middle" fill="#f9a8d4" font-size="9" font-weight="600">WatsonX</text>
  <rect x="680" y="452" width="62" height="22" rx="4" fill="#ec4899" fill-opacity="0.12"/>
  <text x="711" y="467" text-anchor="middle" fill="#f9a8d4" font-size="9" font-weight="600">OpenAI</text>
  <rect x="750" y="452" width="72" height="22" rx="4" fill="#ec4899" fill-opacity="0.12"/>
  <text x="786" y="467" text-anchor="middle" fill="#f9a8d4" font-size="9" font-weight="600">Anthropic</text>

  <!-- Arrow down from repos -->
  <line x1="300" y1="485" x2="300" y2="502" stroke="#475569" stroke-width="1.5" marker-end="url(#flowArrow)"/>

  <!-- === MODELS + SCHEMAS === -->
  <rect x="40" y="505" width="520" height="55" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="60" y="528" fill="#22d3ee" font-size="11" font-weight="700">Models (19) + Schemas (25)</text>
  <text x="60" y="543" fill="#94a3b8" font-size="9">SQLAlchemy ORM models + Pydantic validation schemas. Schemas for API input/output.</text>

  <!-- === VECTOR STORES (right side) === -->
  <rect x="580" y="505" width="290" height="55" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="600" y="528" fill="#c4b5fd" font-size="11" font-weight="700">Vector Stores (5)</text>
  <text x="600" y="543" fill="#94a3b8" font-size="9">VectorStore base → Factory: Milvus, ES, Pinecone, Weaviate, ChromaDB</text>

  <!-- === INFRASTRUCTURE === -->
  <rect x="40" y="580" width="830" height="55" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="60" y="603" fill="#94a3b8" font-size="11" font-weight="700">Infrastructure</text>
  <rect x="200" y="593" width="80" height="24" rx="4" fill="#334155"/>
  <text x="240" y="609" text-anchor="middle" fill="#cbd5e1" font-size="9">PostgreSQL</text>
  <rect x="290" y="593" width="60" height="24" rx="4" fill="#334155"/>
  <text x="320" y="609" text-anchor="middle" fill="#cbd5e1" font-size="9">Milvus</text>
  <rect x="360" y="593" width="55" height="24" rx="4" fill="#334155"/>
  <text x="387" y="609" text-anchor="middle" fill="#cbd5e1" font-size="9">MinIO</text>
  <rect x="425" y="593" width="55" height="24" rx="4" fill="#334155"/>
  <text x="452" y="609" text-anchor="middle" fill="#cbd5e1" font-size="9">MLFlow</text>
  <rect x="490" y="593" width="40" height="24" rx="4" fill="#334155"/>
  <text x="510" y="609" text-anchor="middle" fill="#cbd5e1" font-size="9">etcd</text>
  <text x="560" y="609" fill="#64748b" font-size="9">9 Docker Compose configs | Helm chart | Terraform + Ansible</text>

  <!-- === CI/CD === -->
  <rect x="40" y="650" width="830" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="60" y="674" fill="#94a3b8" font-size="10" font-weight="700">CI/CD</text>
  <text x="130" y="674" fill="#64748b" font-size="9">21 GitHub workflows: 01-lint → 02-security → 03-build → 04-pytest → 05-ci + weekly audit, deploy, docs</text>

  <!-- DI / core/dependencies.py annotation -->
  <rect x="40" y="700" width="830" height="35" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.4"/>
  <text x="450" y="718" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">core/dependencies.py — manual DI wiring. Services injected into routers via FastAPI Depends().</text>
  <text x="450" y="730" text-anchor="middle" fill="#64748b" font-size="8">PipelineContext (frozen dataclass) + ConfigCache (request-scoped) replace per-service DB lookups.</text>
</svg>
